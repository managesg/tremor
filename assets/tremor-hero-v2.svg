<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720" role="img" aria-labelledby="t d">
  <title id="t">TREMOR: measure how a team responds, then use the measurement to run the team</title>
  <desc id="d">Agent team as a network inside ripple rings (susceptibility), with memory directories, dreaming arrows, and the eight research lines as orbiting satellites.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0" stop-color="#0F2757"/>
      <stop offset="0.45" stop-color="#081739"/>
      <stop offset="1" stop-color="#030408"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#57B0B4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#57B0B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#71CACD"/>
      <stop offset="1" stop-color="#3A9499"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#57B0B4"/>
      <stop offset="1" stop-color="#71CACD"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#94D9DB"/>
      <stop offset="1" stop-color="#B8E6E8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowf" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94D9DB" opacity="0.9"/>
    </marker>
    <style>
      @font-face {font-family: 'IBMPlexSans'; src: local('IBM Plex Sans');}
      @font-face {font-family: 'IBMPlexMono'; src: local('IBM Plex Mono');}
      .title {font: 600 34px 'IBMPlexSans', sans-serif; fill: #F0F5FC;}
      .subtitle {font: 400 16px 'IBMPlexSans', sans-serif; fill: #9FB8E4;}
      .label {font: 500 11px 'IBMPlexMono', monospace; fill: #C8D6EF;}
      .label-big {font: 600 13px 'IBMPlexMono', monospace; fill: #FFFFFF;}
      .note {font: 400 10px 'IBMPlexMono', monospace; fill: #6F95D8;}
      .sat-label {font: 500 10px 'IBMPlexMono', monospace; fill: #F0F5FC;}
      .pulse {animation: pulse 2.5s ease-in-out infinite;}
      @keyframes pulse {0%,100% {opacity: 0.25;} 50% {opacity: 0.85;}}
      .spin {animation: spin 20s linear infinite; transform-origin: 720px 360px;}
      @keyframes spin {from {transform: rotate(0deg);} to {transform: rotate(360deg);}}
      .dream-arrow {animation: dream 3s ease-in-out infinite; transform-origin: center;}
      @keyframes dream {0% {stroke-dashoffset: 40; opacity: 0.3;} 50% {stroke-dashoffset: 0; opacity: 1;} 100% {stroke-dashoffset: -40; opacity: 0.3;}}
      .blink {animation: blink 1.5s ease-in-out infinite;}
      @keyframes blink {0%,100% {opacity: 0.4;} 50% {opacity: 1;}}
    </style>
  </defs>
  <rect width="1440" height="720" fill="url(#bg)"/>
  <ellipse cx="720" cy="395" rx="420" ry="260" fill="url(#glow)" opacity="0.3"/>

  <!-- Central team network -->
  <g id="team" filter="url(#soft)">
    <!-- Susceptibility ripple rings (Lance: fluctuation-response) -->
    <ellipse class="spin pulse" cx="720" cy="360" rx="240" ry="160" fill="none" stroke="url(#ring1)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.5"/>
    <ellipse class="spin" cx="720" cy="360" rx="285" ry="190" fill="none" stroke="url(#ring2)" stroke-width="1" stroke-dasharray="6 14" opacity="0.35"/>
    <ellipse class="spin" cx="720" cy="360" rx="330" ry="220" fill="none" stroke="#57B0B4" stroke-width="0.5" stroke-dasharray="4 16" opacity="0.2"/>

    <!-- Agent nodes: 4 core + up to 28 in expanded mode -->
    <g id="agents">
      <!-- Core 4 agents in diamond formation (Lance: team of 4) -->
      <circle cx="720" cy="270" r="14" fill="url(#core)" filter="url(#glowf)">
        <animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="810" cy="360" r="14" fill="url(#core)" filter="url(#glowf)">
        <animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite" begin="0.75s"/>
      </circle>
      <circle cx="720" cy="450" r="14" fill="url(#core)" filter="url(#glowf)">
        <animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <circle cx="630" cy="360" r="14" fill="url(#core)" filter="url(#glowf)">
        <animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite" begin="2.25s"/>
      </circle>

      <!-- Extended ring: 12 more agents (up to 16) -->
      <g class="spin" opacity="0.6">
        <circle cx="720" cy="200" r="9" fill="#57B0B4"/>
        <circle cx="870" cy="270" r="9" fill="#57B0B4"/>
        <circle cx="900" cy="360" r="9" fill="#57B0B4"/>
        <circle cx="870" cy="450" r="9" fill="#57B0B4"/>
        <circle cx="720" cy="520" r="9" fill="#57B0B4"/>
        <circle cx="570" cy="450" r="9" fill="#57B0B4"/>
        <circle cx="540" cy="360" r="9" fill="#57B0B4"/>
        <circle cx="570" cy="270" r="9" fill="#57B0B4"/>
        <circle cx="630" cy="200" r="9" fill="#57B0B4"/>
        <circle cx="810" cy="200" r="9" fill="#57B0B4"/>
        <circle cx="810" cy="520" r="9" fill="#57B0B4"/>
        <circle cx="630" cy="520" r="9" fill="#57B0B4"/>
      </g>

      <!-- Connections: fluctuating edges (Lance: susceptibility measured by rerun variance) -->
      <g stroke="#57B0B4" stroke-width="1" opacity="0.3" filter="url(#soft)">
        <line x1="720" y1="270" x2="810" y2="360" class="pulse"/>
        <line x1="810" y1="360" x2="720" y2="450" class="pulse" style="animation-delay: 0.2s;"/>
        <line x1="720" y1="450" x2="630" y2="360" class="pulse" style="animation-delay: 0.4s;"/>
        <line x1="630" y1="360" x2="720" y2="270" class="pulse" style="animation-delay: 0.6s;"/>
        <!-- Cross connections -->
        <line x1="720" y1="270" x2="720" y2="450" stroke-dasharray="4 8" class="pulse"/>
        <line x1="630" y1="360" x2="810" y2="360" stroke-dasharray="4 8" class="pulse" style="animation-delay: 0.3s;"/>
      </g>
    </g>

    <!-- Memory directories (Lance: Pokemon memory directories, area = chars) -->
    <g id="memory" transform="translate(720, 360)">
      <!-- Daily memory (hippocampus) -->
      <ellipse cx="-100" cy="-120" rx="55" ry="35" fill="#0F2757" stroke="#57B0B4" stroke-width="1.5" opacity="0.9">
        <animate attributeName="rx" values="55;58;55" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="35;38;35" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <text x="-100" y="-112" class="label-big" text-anchor="middle" font-size="11">DAILY</text>
      <text x="-100" y="-99" class="note" text-anchor="middle" font-size="9">HIPPOCAMPUS</text>

      <!-- Long-term knowledge (neocortex) -->
      <ellipse cx="100" cy="-120" rx="65" ry="40" fill="#0F2757" stroke="#71CACD" stroke-width="1.5" opacity="0.9">
        <animate attributeName="rx" values="65;68;65" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="40;43;40" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
      <text x="100" y="-112" class="label-big" text-anchor="middle" font-size="11">LONG-TERM</text>
      <text x="100" y="-99" class="note" text-anchor="middle" font-size="9">NEOCORTEX</text>

      <!-- Dreaming arrows (offline replay: hippocampus → neocortex) -->
      <g class="dream-arrow" stroke="#94D9DB" stroke-width="2" fill="none" marker-end="url(#arrow)">
        <path d="M -45,-90 Q -10,-140 45,-90"/>
        <path d="M -45,-90 Q -10,-140 45,-90" style="animation-delay: 0.5s;"/>
        <path d="M -45,-90 Q -10,-140 45,-90" style="animation-delay: 1s;"/>
      </g>
      <text x="0" y="-160" class="label" text-anchor="middle" fill="#57B0B4">DREAMING REPLAY</text>

      <!-- Consolidation arrows (neocortex → daily, error-correcting) -->
      <g class="dream-arrow" stroke="#57B0B4" stroke-width="2" fill="none" marker-end="url(#arrow)" style="animation-delay: 1.5s;">
        <path d="M 45,-90 Q 10,-140 -45,-90"/>
      </g>
      <text x="0" y="-55" class="label" text-anchor="middle" fill="#71CACD">CONSOLIDATION</text>

      <!-- Poison memory trap (Lance: wrong memory injected, dreaming rescues) -->
      <g transform="translate(-180, 40)" opacity="0.7">
        <circle cx="0" cy="0" r="18" fill="#3A9499" filter="url(#glowf)">
          <animate attributeName="r" values="18;22;18" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="0" y="4" class="note" text-anchor="middle" font-size="9" fill="#FFFFFF">POISON</text>
        <text x="0" y="14" class="note" text-anchor="middle" font-size="9" fill="#FFFFFF">TRAP</text>
        <!-- Dreaming correction spiral -->
        <path d="M 25,0 Q 35,-15 30,-30 Q 20,-40 0,-35 Q -20,-40 -30,-30 Q -35,-15 -25,0"
              stroke="#94D9DB" stroke-width="1.5" fill="none" stroke-dasharray="5 5"
              class="dream-arrow" style="animation-delay: 0.2s;"/>
      </g>

      <!-- Memory immune system (Line 2): quarantine suspect notes -->
      <g transform="translate(180, 40)" opacity="0.6">
        <ellipse cx="0" cy="0" rx="22" ry="16" fill="#081739" stroke="#57B0B4" stroke-width="1" stroke-dasharray="6 4"/>
        <text x="0" y="4" class="note" text-anchor="middle" font-size="8" fill="#57B0B4">QUARANTINE</text>
        <circle cx="0" cy="0" r="6" fill="#94D9DB" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- Eight research lines as orbiting satellites (Lance: "tyranny of agent design" → coordination) -->
  <g id="satellites" class="spin">
    <g transform="rotate(0) translate(420) rotate(0)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#57B0B4" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">SUSCEPTIBILITY</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">ORCHESTRATION</text>
    </g>
    <g transform="rotate(45) translate(420) rotate(-45)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#71CACD" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">MEMORY IMMUNE</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">SYSTEM</text>
    </g>
    <g transform="rotate(90) translate(420) rotate(-90)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#94D9DB" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">CORRELATION-AWARE</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">MONITORS</text>
    </g>
    <g transform="rotate(135) translate(420) rotate(-135)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#57B0B4" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">DREAMING</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">CONSOLIDATION</text>
    </g>
    <g transform="rotate(180) translate(420) rotate(-180)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#71CACD" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">STIGMERGIC</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">COORDINATION</text>
    </g>
    <g transform="rotate(225) translate(420) rotate(-225)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#94D9DB" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">TRUST</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">CALIBRATION</text>
    </g>
    <g transform="rotate(270) translate(420) rotate(-270)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#57B0B4" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">RENORMALIZATION</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">TEAM SIZE</text>
    </g>
    <g transform="rotate(315) translate(420) rotate(-315)">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#0F2757" stroke="#71CACD" stroke-width="1.5" opacity="0.9"/>
      <text x="0" y="-2" class="sat-label" text-anchor="middle">ACTIVATION</text>
      <text x="0" y="10" class="sat-label" text-anchor="middle" font-size="9">READOUTS</text>
    </g>
  </g>

  <!-- Central title -->
  <text x="720" y="580" class="title" text-anchor="middle">TREMOR</text>
  <text x="720" y="610" class="subtitle" text-anchor="middle">Measure how a team responds, then use the measurement to run the team</text>
  <text x="720" y="635" class="note" text-anchor="middle">complex systems · first principles · agent teams · L. Martin's memory/dreaming · D. Almeida's provenance · C. Avilla's trust · L. Hallie's bounded autonomy</text>

  <!-- Bottom bar: arc -->
  <g transform="translate(720, 670)">
    <rect x="-300" y="-4" width="600" height="8" rx="4" fill="#0F2757" stroke="#57B0B4" stroke-width="1"/>
    <rect x="-300" y="-4" width="75" height="8" rx="4" fill="url(#ring1)"/>
    <text x="-290" y="-10" class="note" font-size="9">WEEK 1</text>
    <text x="-150" y="-10" class="note" font-size="9">WEEK 3</text>
    <text x="0" y="-10" class="note" font-size="9">WEEK 6</text>
    <text x="150" y="-10" class="note" font-size="9">6 MONTH</text>
    <text x="220" y="-10" class="note" font-size="9">PUBLIC RELEASE</text>
  </g>
</svg>