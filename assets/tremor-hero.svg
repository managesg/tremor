<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">TREMOR</title>
  <desc id="d">A team of agents around a shared board inside ripple rings. A wrong note spreads along two edges and is stopped by a quarantine ring. Below, a night replay moves notes from a daily store to a long-term store through a verifier. Above, three monitors watch with overlapping views. On the left, the title and the eight research lines.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="80%">
      <stop offset="0" stop-color="#0F2757"/>
      <stop offset="0.5" stop-color="#081739"/>
      <stop offset="1" stop-color="#04050a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ef2ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5ef2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a58bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a58bff" stop-opacity="0"/>
    </linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94D9DB"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#8caaff" stroke-opacity="0.05">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640"/>
  </g>

  <!-- monitors: three views with overlapping cones -->
  <g>
    <path d="M820 60 L770 230 L870 230 Z" fill="url(#cone)"/>
    <path d="M910 52 L860 230 L960 230 Z" fill="url(#cone)"/>
    <path d="M1000 60 L950 230 L1050 230 Z" fill="url(#cone)"/>
    <g fill="#081739" stroke="#a58bff" stroke-width="2">
      <ellipse cx="820" cy="58" rx="16" ry="10"/><ellipse cx="910" cy="50" rx="16" ry="10"/><ellipse cx="1000" cy="58" rx="16" ry="10"/>
    </g>
    <g fill="#a58bff"><circle cx="820" cy="58" r="4"/><circle cx="910" cy="50" r="4"/><circle cx="1000" cy="58" r="4"/></g>
    <text x="1032" y="40" fill="#a58bff" font-family="Helvetica, Arial, sans-serif" font-size="13">monitors: how many</text>
    <text x="1032" y="57" fill="#a58bff" font-family="Helvetica, Arial, sans-serif" font-size="13">independent checks?</text>
  </g>

  <!-- the team -->
  <g transform="translate(910 330)">
    <circle r="150" fill="url(#glow)"/>
    <g fill="none" stroke="#71CACD">
      <circle r="105" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 6">
        <animate attributeName="r" values="100;112;100" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="145" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle r="185" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 8"/>
    </g>
    <g stroke="#94D9DB" stroke-opacity="0.5" stroke-width="1.6">
      <line x1="-70" y1="-55" x2="40" y2="-80"/><line x1="40" y1="-80" x2="92" y2="0"/>
      <line x1="92" y1="0" x2="45" y2="76"/><line x1="45" y1="76" x2="-58" y2="66"/>
      <line x1="-58" y1="66" x2="-96" y2="4"/><line x1="-96" y1="4" x2="-70" y2="-55"/>
      <line x1="0" y1="0" x2="-70" y2="-55"/><line x1="0" y1="0" x2="40" y2="-80"/>
      <line x1="0" y1="0" x2="92" y2="0"/><line x1="0" y1="0" x2="45" y2="76"/>
      <line x1="0" y1="0" x2="-58" y2="66"/><line x1="0" y1="0" x2="-96" y2="4"/>
    </g>
    <!-- wrong note spreading, stopped by quarantine -->
    <g stroke="#ffb547" stroke-width="2.6"><line x1="92" y1="0" x2="45" y2="76"/><line x1="45" y1="76" x2="-58" y2="66"/></g>
    <circle cx="-58" cy="66" r="24" fill="none" stroke="#ff5470" stroke-width="2" stroke-dasharray="5 4"/>
    <g stroke="#04050a" stroke-width="3">
      <circle r="17" fill="#5ef2ff"/>
      <circle cx="-70" cy="-55" r="12" fill="#71CACD"/><circle cx="40" cy="-80" r="12" fill="#71CACD"/>
      <circle cx="92" cy="0" r="13" fill="#ffb547"/><circle cx="45" cy="76" r="12" fill="#ffb547"/>
      <circle cx="-58" cy="66" r="12" fill="#ffcf87"/><circle cx="-96" cy="4" r="12" fill="#71CACD"/>
    </g>
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#04050a"/>
    <rect x="-5" y="-5" width="10" height="10" rx="1" fill="#5ef2ff"/>
    <text x="-88" y="104" fill="#ff8a9e" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">quarantine</text>
  </g>

  <!-- dreaming: night replay from daily to long-term memory through a verifier -->
  <g font-family="Helvetica, Arial, sans-serif">
    <g transform="translate(760 560)">
      <rect x="-60" y="-26" width="120" height="52" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.6"/>
      <text y="-4" fill="#e8ecff" font-size="14" text-anchor="middle">daily notes</text>
      <text y="14" fill="#7a84a8" font-size="11" text-anchor="middle">written in the session</text>
    </g>
    <g transform="translate(1080 560)">
      <rect x="-70" y="-26" width="140" height="52" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.6"/>
      <text y="-4" fill="#e8ecff" font-size="14" text-anchor="middle">long-term memory</text>
      <text y="14" fill="#7a84a8" font-size="11" text-anchor="middle">consolidated</text>
    </g>
    <path d="M824 548 C 880 500, 950 500, 1006 548" fill="none" stroke="#94D9DB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(915 512)">
      <circle r="14" fill="#04050a" stroke="#3ef0a0" stroke-width="2"/>
      <path d="M-6 0 L-2 5 L7 -5" fill="none" stroke="#3ef0a0" stroke-width="2.4"/>
    </g>
    <text x="915" y="485" fill="#94D9DB" font-size="13" text-anchor="middle">dreaming: night replay, verified</text>
  </g>

  <!-- title block -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="108" fill="#5ef2ff" font-size="14" letter-spacing="4" font-weight="600">RESEARCH PROPOSAL · AGENT TEAMS</text>
    <text x="60" y="196" fill="#e8ecff" font-size="92" font-weight="700" letter-spacing="6">TREMOR</text>
    <text x="64" y="246" fill="#c8d6ef" font-size="24">Measure how a team of agents responds,</text>
    <text x="64" y="279" fill="#c8d6ef" font-size="24">then use the measurement to run the team.</text>
    <text x="64" y="330" fill="#7a84a8" font-size="16">Ideas from complex systems, turned into algorithms</text>
    <text x="64" y="352" fill="#7a84a8" font-size="16">for oversight, memory, monitoring and coordination.</text>
    <g font-size="13.5" fill="#e8ecff">
      <g transform="translate(64 392)">
        <rect width="250" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="12" y="20">1 · Susceptibility-guided verification</text>
        <rect x="262" width="210" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="274" y="20">2 · Memory immune system</text>
      </g>
      <g transform="translate(64 432)">
        <rect width="250" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="12" y="20">3 · Decorrelated monitors</text>
        <rect x="262" width="210" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="274" y="20">4 · Dreaming that corrects</text>
      </g>
      <g transform="translate(64 472)">
        <rect width="250" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="12" y="20">5 · Stigmergy and norm carriers</text>
        <rect x="262" width="210" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="274" y="20">6 · Evidence-based trust</text>
      </g>
      <g transform="translate(64 512)">
        <rect width="250" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="12" y="20">7 · Renormalizing team size</text>
        <rect x="262" width="210" height="30" rx="2" fill="#0F2757" stroke="#71CACD" stroke-opacity="0.45"/><text x="274" y="20">8 · Activation readouts</text>
      </g>
    </g>
    <g font-size="12" fill="#a9b3d6" transform="translate(64 590)">
      <circle cx="6" cy="-4" r="6" fill="#71CACD"/><text x="18" y="0">agent</text>
      <circle cx="78" cy="-4" r="6" fill="#ffb547"/><text x="90" y="0">wrong note spreading</text>
      <rect x="236" y="-10" width="12" height="12" rx="1" fill="#5ef2ff"/><text x="254" y="0">shared board</text>
      <circle cx="358" cy="-4" r="6" fill="none" stroke="#71CACD"/><text x="370" y="0">response to a shock</text>
    </g>
  </g>
</svg>
